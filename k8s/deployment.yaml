apiVersion: apps/v1
kind: Deployment
metadata:
  name: remguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remguard
  template:
    metadata:
      labels:
        app: remguard
    spec:
      containers:
        - name: remguard
          image: remguard:local
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: remguard
spec:
  selector:
    app: remguard
  ports:
    - port: 80
      targetPort: 8000
